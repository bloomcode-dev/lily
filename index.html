<script>
{
const PY = String.raw`def generate_stamens_and_pistil(center, basis, scale, wire_t0, wire_t1, surf_t0, surf_t1):
    elements = []

    # 1. Pistil — style with a three-lobed stigma
    Nu_s, Nv_s = 28, 10
    us = np.linspace(0.0, 1.0, Nu_s, dtype=np.float32)
    vs = np.linspace(0.0, 2.0 * math.pi, Nv_s, dtype=np.float32)
    U, V = np.meshgrid(us, vs, indexing="ij")
    theta = V
    P_style = np.zeros((Nu_s, Nv_s, 3), dtype=np.float32)
    C_style = np.zeros((Nu_s, Nv_s, 3), dtype=np.float32)
    for i in range(Nu_s):
        t = us[i]
        lobe = 0.35 * np.maximum(0.0, np.cos(3.0 * theta[i])) * smoothstep(0.86, 1.0, t)
        tip_close = 0.004 * scale * smoothstep(0.9, 1.0, t)
        if t < 0.9:
            base_r = scale * (0.018 - 0.006 * t)
        else:
            base_r = scale * 0.022 + sw * lobe + tip_close
        r = np.full_like(theta[i], base_r)
        P_style[i] = (axis_pt(t)[None, :] + r[:, None] * (np.cos(theta[i])[:, None] * n1 + np.sin(theta[i])[:, None] * n2))
        stigma_mix = smoothstep(0.82, 0.92, t)
        C_style[i] = (1.0 - stigma_mix) * c_green + stigma_mix * c_stigma

    P_style_world = center + P_style @ basis.T
    elements.append(BotanicalElement(
        kind="pistil", P=P_style_world, C=C_style, u_grid=U, v_grid=V,
        wire_t0=wire_t0, wire_t1=wire_t1, surf_t0=surf_t0, surf_t1=surf_t1,
        sss_strength=0.30, spec_strength=0.38, shininess=28.0,
        wire_color=(0.75, 0.95, 0.55), wire_stride_u=6, wire_stride_v=4
    ))

    # 2. Six Curved Filaments + Versatile Pollen Anthers
    for k in range(6):
        az = k * (math.pi / 3.0) + 0.26
        ca, sa = math.cos(az), math.sin(az)
        flare = (0.27 + 0.03 * (k % 2)) * scale
        h_tip = (0.88 + 0.04 * (k % 3)) * scale

        fp0 = np.array([0.020 * scale * ca, 0.02 * scale, 0.020 * scale * sa], dtype=np.float32)
        fp1 = np.array([0.075 * scale * ca, 0.30 * scale, 0.075 * scale * sa], dtype=np.float32)
        fp2 = np.array([0.195 * scale * ca, 0.60 * scale, 0.195 * scale * sa], dtype=np.float32)
        fp3 = np.array([flare * ca, h_tip, flare * sa], dtype=np.float32)

        Nu_f, Nv_f = 22, 8
        uf = np.linspace(0.0, 1.0, Nu_f, dtype=np.float32)
        vf = np.linspace(-1.0, 1.0, Nv_f, dtype=np.float32)
        Uf, Vf = np.meshgrid(uf, vf, indexing="ij")
        th_f = (Vf + 1.0) * math.pi

        fpos, ftan = eval_cubic_bezier(fp0, fp1, fp2, fp3, uf)
        Tf = normalize_v3(ftan)
        N1f, N2f = compute_bishop_frame(Tf)

        P_fil = np.zeros((Nu_f, Nv_f, 3), dtype=np.float32)
        C_fil = np.zeros((Nu_f, Nv_f, 3), dtype=np.float32)
        c_fil_base = np.array([0.56, 0.80, 0.30], dtype=np.float32)
        c_fil_tip = np.array([0.98, 0.95, 0.86], dtype=np.float32)

        for i in range(Nu_f):
            rf = scale * 0.012 * (1.0 - 0.45 * uf[i])
            P_fil[i] = fpos[i] + rf * (np.cos(th_f[i])[:, None] * N1f[i] + np.sin(th_f[i])[:, None] * N2f[i])
            mix = smoothstep(0.15, 0.75, uf[i])
            C_fil[i] = (1.0 - mix) * c_fil_base + mix * c_fil_tip

        P_fil_world = center + P_fil @ basis.T
        st_delay = 0.06 * k
        elements.append(BotanicalElement(
            kind="filament", P=P_fil_world, C=C_fil, u_grid=Uf, v_grid=Vf,
            wire_t0=wire_t0 + st_delay, wire_t1=wire_t1 + st_delay,
            surf_t0=surf_t0 + st_delay, surf_t1=surf_t1 + st_delay,
            sss_strength=0.22, spec_strength=0.30, shininess=24.0,
            wire_color=(0.98, 0.78, 0.86), wire_stride_u=5, wire_stride_v=4
        ))

        # anther — versatile, pivots on the filament tip
        a_len, a_rad = 0.11 * scale, 0.028 * scale
        a_dir = normalize_v3(np.cross(Tf[-1], np.array([0.0, 1.0, 0.0], dtype=np.float32)))
        Na, Ma = 16, 10
        ua = np.linspace(-1.0, 1.0, Na, dtype=np.float32)
        va = np.linspace(0.0, 2.0 * math.pi, Ma, dtype=np.float32)
        Ua, Va = np.meshgrid(ua, va, indexing="ij")
        prof = a_rad * np.sqrt(np.clip(1.0 - Ua ** 2, 0.0, 1.0))
        P_ant = (fpos[-1] + Ua[..., None] * a_len * a_dir
                 + prof[..., None] * (np.cos(Va)[..., None] * N1f[-1] + np.sin(Va)[..., None] * N2f[-1]))
        C_ant = np.broadcast_to(np.array([0.55, 0.22, 0.08], dtype=np.float32), P_ant.shape).copy()
        elements.append(BotanicalElement(
            kind="anther", P=center + P_ant @ basis.T, C=C_ant, u_grid=Ua, v_grid=Va,
            wire_t0=wire_t1 + st_delay, wire_t1=wire_t1 + 0.4 + st_delay,
            surf_t0=surf_t1, surf_t1=surf_t1 + 0.5,
            sss_strength=0.10, spec_strength=0.18, shininess=12.0,
            wire_color=(1.0, 0.70, 0.40), wire_stride_u=4, wire_stride_v=3
        ))

    return elements


def render_frame(frame_idx, elements, cam, light_dir):
    t = frame_idx / FPS
    img = np.zeros((H, W, 3), dtype=np.float32)
    zbuf = np.full((H, W), np.inf, dtype=np.float32)
    for el in sorted(elements, key=lambda e: -e.depth(cam)):
        w = smoothstep(el.wire_t0, el.wire_t1, t)
        s = smoothstep(el.surf_t0, el.surf_t1, t)
        if w > 0.0:
            draw_wireframe(img, el, cam, alpha=w * (1.0 - s))
        if s > 0.0:
            shade_surface(img, zbuf, el, cam, light_dir, alpha=s)
    return add_bloom(img, strength=0.35)


if __name__ == "__main__":
    lily = build_stargazer_lily(seed=23)
    write_video("lily.mp4", lily, frames=FPS * 12)  # something beautiful gets compiled`;
const CODE = PY.split('\n');

const KW = /^(import|from|as|def|class|return|for|in|if|else|elif|while|with|lambda|and|or|not|None|True|False|self)$/;
const BLUE = /^(def|class|self|None|True|False|lambda)$/;
function hl(line) {
  const esc = (t) => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const ci = line.indexOf('#');
  let code = line, com = '';
  if (ci >= 0 && !/"/.test(line.slice(0, ci).replace(/"[^"]*"/g,''))) { code = line.slice(0, ci); com = line.slice(ci); }
  const toks = code.match(/"[^"]*"|'[^']*'|\d+(\.\d+)?|[A-Za-z_][\w]*|\s+|./g) || [];
  const out = toks.map((t, j) => {
    let c = '';
    if (t[0] === '"' || t[0] === "'") c = 's';
    else if (/^\d/.test(t)) c = 'd';
    else if (KW.test(t)) c = BLUE.test(t) ? 'b' : 'k';
    else if (/^[A-Z]/.test(t)) c = 't';
    else if (/^[a-z_]/i.test(t)) c = toks[j + 1] === '(' ? 'f' : (toks[j - 1] === '@' ? 'f' : 'v');
    return [t, c];
  });
  if (com) out.push([com, 'c']);
  return out.map(([t, c]) => [esc(t), c, t.length, t]);
}
const HL = CODE.map(hl);

const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
const capEl = document.getElementById('cap'), startEl = document.getElementById('start');
const codeEl = document.getElementById('code'), srcEl = document.getElementById('src'), termEl = document.getElementById('term');
const miniEl = document.getElementById('mini'), posEl = document.getElementById('pos');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, u = 1, cx = 0, cy = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  u = Math.min(W / 27, H / 60);
  cx = W / 2; cy = H * 0.15 + 25.5 * u;
}
new ResizeObserver(resize).observe(document.body); resize();

const clamp = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
const ease = (t) => 1 - Math.pow(1 - clamp(t), 3);
const inout = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const span = (t, a, b) => clamp((t - a) / (b - a));
let sd = 23; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;

// ── geometry (u units, origin cx, cy)
const STEM = [[0, 18], [-.6, 8], [.9, -2], [.4, -18]];
const bez = (p, t) => { const m = 1 - t; return [0, 1].map(k => m*m*m*p[0][k] + 3*m*m*t*p[1][k] + 3*m*t*t*p[2][k] + t*t*t*p[3][k]); };
const LILIES = [
  { x: -4.4, y: -13.2, R: 6.0, rot: -.35, tilt: .86, at: .86 },
  { x: 5.0, y: -11.0, R: 5.8, rot: .45, tilt: .8, at: .8 },
  { x: -4.2, y: -5.4, R: 5.4, rot: -.7, tilt: .74, at: .68 },
  { x: 4.4, y: -3.4, R: 5.0, rot: .8, tilt: .78, at: .62 }
];
const BUDS = [{ x: 1.4, y: -20.5, L: 4.4, a: .15, at: .97 }, { x: -1.6, y: -18.6, L: 3.4, a: -.45, at: .92 }];
const LEAVES = [[.06, 1], [.14, -1], [.22, 1], [.3, -1], [.38, 1], [.46, -1]];

// tepal shape in local coords (pointing to -y)
function tepalPts(len, wid, n = 22) {
  const L = [], Rr = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n;
    const w = wid * Math.sin(Math.PI * Math.pow(s, .8)) * (1 - Math.pow(s, 3) * .2);
    L.push([-w, -len * s]); Rr.push([w, -len * s]);
  }
  return { L, R: Rr };
}
// world transform for a lily tepal
function mk(l, a) {
  const cr = Math.cos(l.rot), sr = Math.sin(l.rot), ca = Math.cos(a), sa = Math.sin(a);
  return (lx, ly) => {
    const px = lx * ca - ly * sa, py = lx * sa + ly * ca;
    const qy = py * l.tilt;
    return [cx + (l.x * u) + px * cr - qy * sr, cy + (l.y * u) + px * sr + qy * cr];
  };
}
// precompute per lily: tepals, spots, particle targets
LILIES.forEach((l, li) => {
  l.tep = [];
  for (let i = 0; i < 6; i++) {
    const inner = i % 2 === 1;
    const a = i * Math.PI / 3 + (inner ? .05 : 0);
    const len = (inner ? .96 : 1) , wid = inner ? .36 : .29;
    const spots = Array.from({ length: 16 }, () => [(rnd() - .5) * .5, .12 + rnd() * .45, .012 + rnd() * .02]);
    const cloud = Array.from({ length: 46 }, () => { const s = Math.pow(rnd(), .8), w = Math.sin(Math.PI * Math.pow(s, .8)) * (rnd() * 2 - 1); return [w, s, rnd() * 6.28, rnd()]; });
    l.tep.push({ a, len, wid, inner, spots, cloud });
  }
  l.tep.sort((p, q) => (p.inner ? 1 : 0) - (q.inner ? 1 : 0));
  l.stam = Array.from({ length: 6 }, (_, k) => ({ a: k * 1.047 + .5, len: .62 + rnd() * .12, bend: (rnd() - .5) * .3 }));
});

function tepalPath(T, l, tp, R) {
  const { L, R: Rr } = tepalPts(tp.len * R, tp.wid * R);
  ctx.beginPath();
  ctx.moveTo(...T(0, 0));
  for (const p of Rr) ctx.lineTo(...T(p[0], p[1]));
  for (let i = L.length - 1; i >= 0; i--) ctx.lineTo(...T(L[i][0], L[i][1]));
  ctx.closePath();
}

let OPEN = 1;
function withOpen(l, o, sway, fn) {
  OPEN = o; const r0 = l.rot; l.rot = r0 + sway;
  for (const tp of l.tep) { tp.a0 ??= tp.a; tp.l0 ??= tp.len; tp.a = tp.a0 * (.08 + .92 * o) + (1 - o) * (tp.inner ? .12 : -.12); tp.len = tp.l0 * (.5 + .5 * o); }
  fn();
  for (const tp of l.tep) { tp.a = tp.a0; tp.len = tp.l0; }
  l.rot = r0; OPEN = 1;
}
function drawLilyWire(l, p) {
  if (p <= 0) return;
  const R = l.R * u;
  for (const tp of l.tep) {
    const T = mk(l, tp.a);
    ctx.save(); ctx.shadowColor = 'rgba(255,150,200,.9)'; ctx.shadowBlur = 6;
    ctx.strokeStyle = `rgba(255,170,210,${.8 * p})`; ctx.lineWidth = .9;
    tepalPath(T, l, tp, R); ctx.stroke(); ctx.restore();
    const { L, R: Rr } = tepalPts(tp.len * R, tp.wid * R, 10);
    ctx.beginPath();
    for (let i = 1; i < 10; i += 1) { ctx.moveTo(...T(L[i][0], L[i][1])); ctx.lineTo(...T(Rr[i][0], Rr[i][1])); }
    for (let i = 2; i <= 10; i += 2) { ctx.moveTo(...T(0, 0)); ctx.lineTo(...T(Rr[i][0], Rr[i][1])); ctx.moveTo(...T(0, 0)); ctx.lineTo(...T(L[i][0], L[i][1])); }
    ctx.moveTo(...T(0, 0)); ctx.lineTo(...T(0, -tp.len * R));
    ctx.strokeStyle = `rgba(255,150,195,${.28 * p})`; ctx.stroke();
    ctx.fillStyle = `rgba(255,190,220,${.8 * p})`;
    for (let i = 0; i <= 10; i += 2) for (const q of [L[i], Rr[i]]) { const [x, y] = T(q[0], q[1]); ctx.fillRect(x - 1, y - 1, 2, 2); }
  }
}

function drawLilyCloud(l, p, t) {
  if (p <= 0 || p >= 1.2) return;
  const R = l.R * u, a = 1 - span(p, .85, 1.15);
  ctx.fillStyle = `rgba(255,140,190,${.85 * a})`;
  for (const tp of l.tep) {
    const T = mk(l, tp.a), w = tp.wid * R, len = tp.len * R;
    for (const [cw, s, ang, r] of tp.cloud) {
      const [tx, ty] = T(cw * w, -s * len);
      const k = ease(p * 1.1 - r * .15);
      const sx = cx + Math.cos(ang) * (W * .45) * (1 - r * .3), sy = cy + Math.sin(ang) * (H * .4);
      const x = sx + (tx - sx) * k + Math.sin(t * 3 + ang) * (1 - k) * 6, y = sy + (ty - sy) * k;
      ctx.fillRect(x - .8, y - .8, 1.6, 1.6);
    }
  }
}

function drawLilyFill(l, p) {
  if (p <= 0) return;
  const R = l.R * u;
  const [ox, oy] = [cx + l.x * u, cy + l.y * u];
  ctx.globalAlpha = p;
  for (const tp of l.tep) {
    const T = mk(l, tp.a);
    const [tipx, tipy] = T(0, -tp.len * R);
    const g = ctx.createLinearGradient(ox, oy, tipx, tipy);
    g.addColorStop(0, '#9e0c3e'); g.addColorStop(.22, '#d23a72'); g.addColorStop(.5, '#f2a3c0'); g.addColorStop(.78, '#fff1f5'); g.addColorStop(1, '#ffffff');
    // shadow
    ctx.save(); ctx.translate(1.5, 2.5); tepalPath(T, l, tp, R); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill(); ctx.restore();
    tepalPath(T, l, tp, R); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = .8; ctx.stroke();
    // midrib groove
    ctx.strokeStyle = 'rgba(120,10,50,.45)'; ctx.lineWidth = Math.max(1, R * .025);
    ctx.beginPath(); ctx.moveTo(...T(0, 0)); ctx.quadraticCurveTo(...T(R * .02, -tp.len * R * .4), ...T(0, -tp.len * R * .72)); ctx.stroke();
    // spots
    ctx.fillStyle = '#7d0730';
    for (const [sx, sy, sr] of tp.spots) {
      const s = sy, w = tp.wid * Math.sin(Math.PI * Math.pow(s, .8)) * .8;
      const [x, y] = T(sx * w * R * 2, -s * tp.len * R);
      ctx.beginPath(); ctx.ellipse(x, y, sr * R, sr * R * .7, tp.a, 0, 7); ctx.fill();
    }
    // ruffled white edge highlight
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = .6;
    ctx.beginPath(); ctx.moveTo(...T(tp.wid * R * .5, -tp.len * R * .35)); ctx.quadraticCurveTo(...T(tp.wid * R * .55, -tp.len * R * .7), ...T(0, -tp.len * R * .98)); ctx.stroke();
  }
  // stamens + pistil
  const T0 = mk(l, 0);
  for (const s of l.stam) {
    const T = mk(l, s.a), L = s.len * R * clamp((OPEN - .35) / .65);
    if (L <= 0) continue;
    const [ex, ey] = T(s.bend * R, -L);
    ctx.strokeStyle = '#e4efc6'; ctx.lineWidth = Math.max(1, R * .022);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.quadraticCurveTo(...T(s.bend * R * .2, -L * .6), ex, ey); ctx.stroke();
    ctx.fillStyle = '#8a3510'; ctx.beginPath(); ctx.ellipse(ex, ey, R * .055, R * .025, s.a + l.rot, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(230,120,40,.7)'; ctx.beginPath(); ctx.ellipse(ex - 1, ey - 1, R * .03, R * .012, s.a + l.rot, 0, 7); ctx.fill();
  }
  if (OPEN < .4) { ctx.globalAlpha = 1; return; }
  const [px, py] = T0(R * .05, -R * .78 * clamp((OPEN - .4) / .6));
  ctx.strokeStyle = '#cfe2a0'; ctx.lineWidth = Math.max(1.2, R * .03);
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.quadraticCurveTo(...T0(-R * .04, -R * .4), px, py); ctx.stroke();
  ctx.fillStyle = '#5e7f2c'; ctx.beginPath(); ctx.arc(px, py, R * .045, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

function budPath(b) {
  const [x, y] = [cx + b.x * u, cy + b.y * u], L = b.L * u;
  ctx.save(); ctx.translate(x, y); ctx.rotate(b.a);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(L * .3, -L * .2, L * .28, -L * .8, 0, -L);
  ctx.bezierCurveTo(-L * .28, -L * .8, -L * .3, -L * .2, 0, 0);
}
function drawBud(b, wire, fill) {
  if (wire > 0) { budPath(b); ctx.strokeStyle = `rgba(150,255,140,${.6 * wire * (1 - fill)})`; ctx.lineWidth = .8; ctx.stroke(); ctx.restore(); }
  if (fill > 0) {
    budPath(b); const L = b.L * u;
    const g = ctx.createLinearGradient(0, 0, 0, -L);
    g.addColorStop(0, '#3f7a2e'); g.addColorStop(.5, '#a7c46a'); g.addColorStop(.85, '#e9b8c8'); g.addColorStop(1, '#d9688f');
    ctx.globalAlpha = fill; ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(40,80,30,.5)'; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -L * .95); ctx.stroke();
    ctx.globalAlpha = 1; ctx.restore();
  }
}

function stemDraw(p, glow) {
  if (p <= 0) return;
  ctx.save();
  ctx.lineCap = 'round';
  const pts = []; for (let i = 0; i <= 60 * p; i++) pts.push(bez(STEM, i / 60));
  const path = () => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(cx + x * u, cy + y * u) : ctx.moveTo(cx + x * u, cy + y * u)); };
  if (glow > 0) { ctx.shadowColor = 'rgba(110,255,90,.9)'; ctx.shadowBlur = 12 * glow; path(); ctx.strokeStyle = `rgba(140,255,120,${glow})`; ctx.lineWidth = Math.max(1.5, u * .2); ctx.stroke(); ctx.shadowBlur = 0; }
  path(); ctx.strokeStyle = '#2f6b2a'; ctx.lineWidth = Math.max(2, u * .34); ctx.globalAlpha = 1 - glow * .6; ctx.stroke();
  ctx.globalAlpha = 1; ctx.restore();
}
function pedicel(x, y, at, p, glow) {
  if (p <= 0) return;
  const [sx, sy] = bez(STEM, at);
  const X0 = cx + sx * u, Y0 = cy + sy * u, X1 = cx + x * u, Y1 = cy + y * u;
  const mx = X0 + (X1 - X0) * .3, my = Math.min(Y0, Y1) - u * 1.5;
  ctx.save(); ctx.lineCap = 'round';
  if (glow > 0) { ctx.shadowColor = 'rgba(110,255,90,.9)'; ctx.shadowBlur = 10 * glow; }
  ctx.strokeStyle = glow > .3 ? `rgba(140,255,120,${glow})` : '#356f2c'; ctx.lineWidth = Math.max(1.4, u * .2);
  ctx.beginPath(); ctx.moveTo(X0, Y0);
  const steps = 20;
  for (let i = 1; i <= steps * p; i++) { const t = i / steps, m = 1 - t; ctx.lineTo(m * m * X0 + 2 * m * t * mx + t * t * X1, m * m * Y0 + 2 * m * t * my + t * t * Y1); }
  ctx.stroke(); ctx.restore();
}
function leaf(at, side, wire, fill) {
  if (wire <= 0) return;
  const [sx, sy] = bez(STEM, at), [nx, ny] = bez(STEM, at + .02);
  const ang = Math.atan2(ny - sy, nx - sx) + side * .62;
  const L = u * (6.2 - at * 3) * ease(wire), Wd = u * .75;
  ctx.save(); ctx.translate(cx + sx * u, cy + sy * u); ctx.rotate(ang);
  const path = () => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(L * .3, -Wd * side, L * .7, -Wd * .8 * side, L, side * u * .4); ctx.bezierCurveTo(L * .7, Wd * .2 * side, L * .3, Wd * .4 * side, 0, 0); };
  if (fill < 1) { ctx.shadowColor = 'rgba(110,255,90,.9)'; ctx.shadowBlur = 8; path(); ctx.strokeStyle = `rgba(140,255,120,${.9 * (1 - fill)})`; ctx.lineWidth = .9; ctx.stroke(); ctx.shadowBlur = 0; }
  if (fill > 0) {
    const g = ctx.createLinearGradient(0, -Wd, 0, Wd);
    g.addColorStop(0, '#3e8a35'); g.addColorStop(1, '#173d16');
    path(); ctx.globalAlpha = fill; ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(170,230,150,.4)'; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L * .9, side * u * .3); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

const dust = Array.from({ length: 120 }, () => ({ x: rnd(), y: rnd(), p: rnd() * 6, s: rnd() * 1.2 + .3, v: rnd() * .02 }));
function drawDust(t, a) {
  for (const d of dust) {
    const al = (.2 + .8 * (.5 + .5 * Math.sin(t * 2 + d.p))) * a;
    ctx.fillStyle = `rgba(255,255,255,${al * .7})`;
    ctx.fillRect(d.x * W, ((d.y - t * d.v) % 1 + 1) % 1 * H, d.s, d.s);
  }
}

function scene(t) {
  ctx.clearRect(0, 0, W, H);
  drawDust(t, span(t, 0, 1.5) * (1 - .5 * span(t, 9, 11)));
  const gl = span(t, .8, 2);
  if (gl > 0) {
    ctx.strokeStyle = `rgba(255,255,255,${.35 * gl})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - 6 * u * gl, cy + 18.4 * u); ctx.lineTo(cx + 6 * u * gl, cy + 18.4 * u); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${.45 * gl})`; ctx.font = `${Math.max(8, u * .38)}px "JetBrains Mono", monospace`; ctx.textAlign = 'center';
    ctx.fillText('LILIUM ORIENTALIS · STARGAZER', cx, cy + 19.8 * u);
  }
  const glowS = 1 - span(t, 8.5, 10);
  stemDraw(inout(span(t, 1.2, 3.8)), glowS);
  LEAVES.forEach(([at, side], i) => leaf(at, side, span(t, 2.4 + i * .18, 3.6 + i * .18), span(t, 8.4 + i * .08, 10)));
  BUDS.forEach(b => pedicel(b.x, b.y, b.at, span(t, 3.4, 4.4), glowS));
  LILIES.forEach((l, i) => pedicel(l.x, l.y, l.at, span(t, 3.3 + i * .12, 4.3 + i * .12), glowS));
  BUDS.forEach(b => drawBud(b, span(t, 4.2, 5.2), span(t, 9, 10.6)));
  const settle = span(t, 10.5, 12);
  [3, 2, 1, 0].forEach(i => {
    const l = LILIES[i], d = (3 - i) * .35;
    const cloud = span(t, 4.2 + d, 6.6 + d) * 1.15;
    const wire = span(t, 5.6 + d, 7.2 + d) * (1 - span(t, 9 + d, 10.6 + d) * .9);
    const fill = ease(span(t, 8.0 + d, 10.4 + d));
    const open = inout(span(t, 5.8 + d, 10.6 + d));
    const sway = Math.sin(t * .45 + i * 1.7) * .05 * settle;
    withOpen(l, open, sway, () => {
      drawLilyCloud(l, cloud, t);
      drawLilyFill(l, fill);
      drawLilyWire(l, wire);
    });
  });
}

let start = 0, raf = 0;
function frame(now) {
  const t = reduce ? 99 : (now - start) / 1000;
  scene(t);
  raf = requestAnimationFrame(frame);
}

// ── code intro
function renderCode(n) {
  let seen = 0, html = '';
  for (let li = 0; li < HL.length; li++) {
    let o = '', stop = false;
    for (const [t, c, len, raw] of HL[li]) {
      if (seen + len <= n) { o += c ? `<span class="${c}">${t}</span>` : t; seen += len; continue; }
      const part = raw.slice(0, n - seen).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      o += c ? `<span class="${c}">${part}</span>` : part; seen = n; stop = true; break;
    }
    if (stop || seen >= n) return { html: html + `<span class="ln cl" data-n="${li + 413}">${o}<span class="cur"></span></span>`, li, full: false };
    html += `<span class="ln" data-n="${li + 413}">${o}</span>`;
    seen++;
  }
  return { html, li: HL.length - 1, full: true };
}
miniEl.innerHTML = CODE.map(l => `<div style="width:${Math.min(100, l.trim().length * 1.6)}%;margin-left:${(l.length - l.trimStart().length) * 1.6}%"></div>`).join('');

let codeRaf = 0, timers = [];
function runCode(done) {
  cancelAnimationFrame(codeRaf); timers.forEach(clearTimeout); timers = [];
  codeEl.style.display = 'block'; codeEl.style.opacity = 1; document.getElementById('stage').classList.add('codephase');
  document.getElementById('sticky').innerHTML = `<span class="ln" data-n="413">${HL[0].map(([t, c]) => c ? `<span class="${c}">${t}</span>` : t).join('')}</span>`;
  capEl.innerHTML = 'What happens when imagination<br>meets Python?'; capEl.classList.add('on');
  termEl.innerHTML = '<div class="tt"><b>TERMİNAL</b><span>ÇIKTI</span><span>SORUNLAR</span></div><span class="m">~/flowers</span> <span class="p">❯</span> ';
  if (reduce) { codeEl.style.display = 'none'; done(); return; }
  const total = PY.length, DUR = 6000, t0 = performance.now();
  const lh = () => parseFloat(getComputedStyle(srcEl).lineHeight) || 18;
  const step = (now) => {
    const n = Math.floor(total * Math.min(1, (now - t0) / DUR));
    const r = renderCode(n);
    srcEl.innerHTML = r.html;
    posEl.textContent = `Sat ${r.li + 1}, Süt ${(CODE[r.li] || '').length + 1}`;
    srcEl.scrollTop = Math.max(0, (r.li + 4) * lh() - srcEl.clientHeight);
    document.getElementById('sticky').classList.toggle('on', srcEl.scrollTop > 0);
    if (n < total) { codeRaf = requestAnimationFrame(step); return; }
    const base = termEl.innerHTML;
    const out = ['python lily.py', '<br><span class="m">compiling petals…</span> 6 × 240 pts', '<br><span class="g">✓</span> render ready'];
    out.forEach((_, i) => timers.push(setTimeout(() => { termEl.innerHTML = base + out.slice(0, i + 1).join(''); }, 280 * (i + 1))));
    timers.push(setTimeout(() => { codeEl.style.opacity = 0; capEl.classList.remove('on'); }, 280 * out.length + 600));
    timers.push(setTimeout(() => { codeEl.style.display = 'none'; document.getElementById('stage').classList.remove('codephase'); capEl.textContent = 'Something beautiful gets compiled. 🌹'; capEl.classList.add('on'); done(); }, 280 * out.length + 1500));
  };
  codeRaf = requestAnimationFrame(step);
}

function play() {
  cancelAnimationFrame(raf);
  ctx.clearRect(0, 0, W, H);
  runCode(() => { start = performance.now(); raf = requestAnimationFrame(frame); });
}
document.getElementById('go').addEventListener('click', () => {
  const el = document.documentElement;
  try { const r = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); r && r.catch && r.catch(() => {}); } catch (e) {}
  startEl.style.opacity = 0; setTimeout(() => startEl.style.display = 'none', 600);
  play();
});
}
</script>
